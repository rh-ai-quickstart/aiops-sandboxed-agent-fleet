name: build-openclaw-sandbox

# Builds the custom OpenClaw sandbox image (community base pinned by digest + a newer Node.js
# and OpenClaw, images/openclaw-sandbox/Dockerfile) and publishes it to GHCR under this
# repo's owner. Run it from the Actions tab (Run workflow), or it triggers when the
# Dockerfile/workflow changes.
#
# After the first run, make the package PUBLIC (GitHub → Packages → openclaw-sandbox →
# Package settings → Change visibility) so the cluster can pull it without a pull secret,
# then pin chart/charts/openshell/values.yaml upstream.sandbox.image (or OPENCLAW_SANDBOX_IMAGE) to:
#   ghcr.io/<owner>/openclaw-sandbox:<openclaw version>

on:
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: OpenClaw npm version to bake in
        default: "2026.8.2"
      node_version:
        description: Node.js version installed with `n`
        default: "22.22.3"
  push:
    paths:
      - images/openclaw-sandbox/Dockerfile
      - .github/workflows/build-openclaw-sandbox.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.openclaw_version || '2026.8.2' }}
      NODE_VERSION: ${{ github.event.inputs.node_version || '22.22.3' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: images/openclaw-sandbox
          push: true
          build-args: |
            OPENCLAW_VERSION=${{ env.VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/openclaw-sandbox:${{ env.VERSION }}
