name: Build workshop image

# Builds web/Dockerfile and pushes it to the repository the chart uses by default
# (chart/values.yaml workshop.image = quay.io/mmurakam/nemoclaw-workshop). Configurable:
#   - repository variable WORKSHOP_IMAGE_REPO (e.g. ghcr.io/<owner>/nemoclaw-workshop), or
#     the `image_repo` input of a manual run;
#   - credentials: ghcr.io uses GITHUB_TOKEN; any other registry needs the secrets
#     REGISTRY_USERNAME / REGISTRY_PASSWORD (e.g. a quay.io robot account).
# Deploy the result with WORKSHOP_IMAGE=<repo>:<tag> scripts/deploy.sh | scripts/lab.sh.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_repo:
        description: Image repository (default vars.WORKSHOP_IMAGE_REPO or the chart default)
        required: false
        default: ""

env:
  IMAGE_REPO: ${{ inputs.image_repo || vars.WORKSHOP_IMAGE_REPO || 'quay.io/mmurakam/nemoclaw-workshop' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Registry of the target repository
        id: reg
        run: echo "registry=${IMAGE_REPO%%/*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.reg.outputs.registry }}
          username: ${{ steps.reg.outputs.registry == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ steps.reg.outputs.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=semver,pattern=v{{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
