# OpenClaw agent egress policy — for a gateway-created OpenShell sandbox.
#
# This is the REAL OpenShell sandbox-policy schema (see the shipped
# /etc/openshell/policy.yaml): `network_policies` is a MAP keyed by id, each binary
# is a `{ path: ... }` object, and simple allows are bare `{ host, port }` (L4 tunnel).
# OpenShell is deny-by-default — a gateway sandbox can reach ONLY the hosts below,
# and ONLY via the listed binaries.
#
# NOTE: a gateway sandbox is network-SEALED from the in-cluster Kubernetes API by the
# supervisor (egress proxy, deny-by-default). That is by design — these agents do governed
# EXTERNAL work, not in-cluster reads.
#
# INFERENCE (OpenShell 0.1.x): the model endpoint is NOT listed here. The sandbox is created
# with `--provider <name>` (a provider of the `maas-openai` profile, see
# manifests/openclaw/inference-profile.yaml.tmpl); an attached provider contributes its own
# `_provider_*` network-policy entry for the profile's endpoint + binaries. Inside the
# sandbox $OPENAI_API_KEY is only a placeholder: the supervisor proxy swaps in the real key
# on requests to that endpoint, so the agent never sees the key. OpenClaw's baseUrl is the
# real endpoint (the 0.0.x `inference.local` router no longer exists).
#
# NAMESPACE: the registry host below is the single-instance default
# (registry.openshell.svc.cluster.local). The OpenShell proxy does not resolve single-label
# hosts, so fleet.sh / 45-openclaw.sh / the workshop rewrite it to
# registry.<OPENSHELL_NAMESPACE>.svc.cluster.local for other namespaces (lab mode).

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /var/tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # Inference is NOT listed here — the attached inference provider adds its endpoint
  # (see the header note).

  # --- Skill supply chain: ONE governed source ---
  # The agent's ONLY skill+dep egress is our private in-cluster npm registry (Verdaccio,
  # deployed per instance by chart/charts/openshell/templates/registry.yaml), reachable over
  # the cluster network at registry.<namespace>.svc.cluster.local:4873. Skills enter that registry two ways — authored
  # in-sandbox and published, or vetted-and-mirrored from ClawHub by a curator — and the agent
  # installs only from it. Verdaccio uplinks npmjs and caches transitive deps, so the agent
  # never talks to registry.npmjs.org directly either: a single, auditable chokepoint.
  #
  # ClawHub (clawhub.ai / hub.openclaw.ai) is deliberately ABSENT: the agent cannot pull
  # skills straight from the internet. The skills lesson opens a temporary ClawHub door with
  # `openshell policy update --add-endpoint` to demo edge-vetting, then removes it — this file
  # is the durable, locked posture.
  #
  # npm fetches SCOPED packages as /@scope%2fname — the encoded '/' (%2F). The proxy's path
  # parser rejects %2F unless the endpoint is protocol: rest + allow_encoded_slash: true
  # (NOT settable via the CLI --add-endpoint; it must live here). Scoped names like
  # @workshop/<skill> need it, so the registry endpoint sets it.
  in-cluster-registry:
    name: in-cluster-registry
    endpoints:
      - { host: registry.openshell.svc.cluster.local, port: 4873, access: full, protocol: rest, allow_encoded_slash: true }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/npm }
      - { path: /usr/local/bin/npm }

  # --- ClawHub plugin dependency installs (public npm registry, direct) ---
  # `openclaw plugins install clawhub:<plugin>` downloads the plugin from ClawHub, then runs an
  # npm install for the plugin's OWN dependencies — and that step talks to registry.npmjs.org
  # DIRECTLY (it does not route through Verdaccio like @workshop skills do). npm requests scoped
  # deps as /@scope%2Fname, so — exactly like the in-cluster registry above — this endpoint needs
  # protocol: rest + allow_encoded_slash: true (the %2F is NOT settable via CLI --add-endpoint,
  # so it must live here).
  #
  # POSTURE NOTE: this is a deliberate relaxation of the "Verdaccio is the ONLY skill/dep egress"
  # chokepoint documented above — it gives the agent a direct line to the public npm registry for
  # ClawHub-plugin deps. Keep it only if you want ClawHub plugin installs to work out of the box;
  # delete this block to restore the strict single-source posture (then ClawHub plugins must be
  # mirrored into Verdaccio instead).
  npm-registry:
    name: npm-registry
    endpoints:
      - { host: registry.npmjs.org, port: 443, access: full, protocol: rest, allow_encoded_slash: true }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/npm }
      - { path: /usr/local/bin/npm }

  # --- web search (DuckDuckGo, key-free) — the agent scrapes DuckDuckGo's non-JS
  #     search pages, so allow those hosts for node. Enabled via openclaw config
  #     tools.web.search.provider=duckduckgo. ---
  websearch:
    name: websearch
    endpoints:
      - { host: duckduckgo.com, port: 443, access: full }
      - { host: html.duckduckgo.com, port: 443, access: full }
      - { host: lite.duckduckgo.com, port: 443, access: full }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
