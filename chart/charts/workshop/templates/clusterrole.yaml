{{- /*
The ONLY cluster-scoped grant of the workshop ServiceAccount (= the attendee's terminal
identity): read-only nodes, SCCs and CRDs for the "the cluster" / "openshell-ops" lessons.
No cluster-wide pod, log, secret or exec access.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-workshop
  labels:
    {{- include "workshop.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
