{{- /*
Per-instance Kubernetes event exporter. Watches ONLY the demo namespace and prints events
to stdout; the ClusterLogForwarder ships them to Loki under
{kubernetes_namespace_name="<release namespace>", kubernetes_container_name="event-exporter"},
which the events agent and the workshop query with namespace-scoped credentials.
*/ -}}
{{- if .Values.eventExporter.enabled }}
{{- $ns := .Release.Namespace -}}
{{- $demo := include "workshop.demoNamespace" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-exporter
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: event-exporter
    app.kubernetes.io/part-of: nemoclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $ns }}-event-exporter
  namespace: {{ $demo }}
  labels:
    app.kubernetes.io/name: event-exporter
    app.kubernetes.io/part-of: nemoclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: event-exporter
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-exporter-cfg
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: event-exporter
    app.kubernetes.io/part-of: nemoclaw
data:
  config.yaml: |
    logLevel: error
    logFormat: json
    namespace: {{ $demo }}
    maxEventAgeSeconds: 300
    kubeQPS: 20
    kubeBurst: 40
    route:
      routes:
        - match:
            - receiver: stdout
    receivers:
      - name: stdout
        stdout: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-exporter
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: event-exporter
    app.kubernetes.io/part-of: nemoclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-exporter
        app.kubernetes.io/part-of: nemoclaw
      annotations:
        checksum/config: {{ printf "%s" $demo | sha256sum | trunc 12 }}
    spec:
      serviceAccountName: event-exporter
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: event-exporter
          image: {{ .Values.eventExporter.image }}
          args: ["-conf=/config/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - name: cfg
              mountPath: /config
              readOnly: true
      volumes:
        - name: cfg
          configMap: { name: event-exporter-cfg }
{{- end }}
