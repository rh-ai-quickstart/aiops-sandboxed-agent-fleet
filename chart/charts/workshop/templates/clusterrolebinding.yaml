apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-workshop
  labels:
    {{- include "workshop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-workshop
subjects:
  - kind: ServiceAccount
    name: workshop
    namespace: {{ .Release.Namespace }}
