# Defaults for a standalone install (deploy.sh / lab.sh install this subchart as its own
# release in the shared `monitoring` namespace and set global.clusterAppsDomain).
global:
  clusterAppsDomain: ""

# Standalone Grafana (OpenShift does not include Grafana)
grafana:
  fullnameOverride: grafana
  # Namespaced RBAC: the sidecars only read ConfigMaps/Secrets in Grafana's own namespace
  # (a Role instead of the chart's cluster-wide configmaps+secrets ClusterRole).
  rbac:
    namespaced: true
  # Grafana runs as UID 472 — needs nonroot-v2 SCC (granted in scc-grants.yaml).
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  initChownData:
    enabled: false
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
    dashboards:
      # = sidecar.dashboards.folder (chart default /tmp/dashboards) + the ConfigMap key.
      default_home_dashboard_path: /tmp/dashboards/agent-fleet.json
  service:
    type: ClusterIP
  persistence:
    enabled: true
    type: pvc
    accessModes: ["ReadWriteOnce"]
    size: 2Gi
  sidecar:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    # searchNamespace unset (null) = Grafana's own namespace only. Never ALL: any user able
    # to create a labelled ConfigMap in another namespace could inject a datasource that
    # sends Grafana's monitoring token to an arbitrary URL.
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: true
      label: grafana_datasource

# OpenShift monitoring endpoints
endpoints:
  prometheus:
    url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
  loki:
    url: "https://logging-loki-gateway-http.openshift-logging.svc.cluster.local:8080"
    applicationPath: "/api/logs/v1/application"
    infrastructurePath: "/api/logs/v1/infrastructure"
  tempo:
    url: "https://tempo-tempostack-gateway.observability-hub.svc.cluster.local:8080"
    # The gateway serves the Tempo query API under /api/traces/v1/<tenant>/tempo
    # (/api/traces/v1/<tenant>/ itself proxies the Jaeger UI/API, not the Tempo API).
    tenantPath: "/api/traces/v1/dev/tempo"

# Wrapper-level settings
grafanaRoute:
  enabled: true
eventExporter:
  enabled: true
