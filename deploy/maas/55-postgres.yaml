# PostgreSQL for OpenShift AI Models-as-a-Service (API keys, subscriptions). MaaS requires PostgreSQL
# 14+ supplied by the administrator. Lab-sized single instance. Credentials live in Secret
# `maas-postgres` (generated by scripts/maas.sh, never committed); maas.sh also creates
# `maas-db-config` (DB_CONNECTION_URL) that the MaaS API reads.
---
apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ai-gateway-infra
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maas-postgres
  namespace: redhat-ai-gateway-infra
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-postgres
  namespace: redhat-ai-gateway-infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: maas-postgres}
  template:
    metadata:
      labels: {app: maas-postgres}
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: maas-postgres
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maas-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: maas-postgres
  namespace: redhat-ai-gateway-infra
spec:
  selector: {app: maas-postgres}
  ports:
    - port: 5432
      targetPort: 5432
