# NVIDIA Nemotron 3 Nano 30B-A3B FP8 (Red Hat validated model, modelcar from the Red Hat AI catalog)
# served with the GA "Distributed inference with llm-d" runtime (LLMInferenceService), on one GPU.
# Fits 1x L40S 48GB (32.7 GB FP8 weights). vLLM flags follow the model card / vLLM recipe:
# qwen3_coder tool calling (OpenClaw agents), nemotron_v3 reasoning parser, reasoning OFF by default
# (short agent calls; clients can enable it per request), 64k context (OpenClaw reported a
# context overflow for its agent prompt at 32k), FP8 KV cache.
# Scale throughput with spec.replicas (one GPU node per replica: scripts/maas.sh MAAS_GPU_REPLICAS).
# VLLM_ADDITIONAL_ARGS is parsed by a shell in the runtime image: quote JSON values with single quotes.
---
apiVersion: v1
kind: Namespace
metadata:
  name: maas-models
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: nemotron-3-nano
  namespace: maas-models
spec:
  replicas: 1
  model:
    uri: oci://registry.redhat.io/rhai/modelcar-nvidia-nemotron-3-nano-30b-a3b-fp8:3.0
    name: nemotron-3-nano
  router:
    route: {}
    # Attach to the Models-as-a-Service gateway (MaaSModelRef requires it; the default would be
    # openshift-ai-inference, which MaaS rejects).
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    scheduler: {}
  template:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --max-model-len 65536 --gpu-memory-utilization 0.92 --kv-cache-dtype fp8
              --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3
              --max-num-seqs 128 --enable-prefix-caching --mamba-ssm-cache-dtype float16
              --trust-remote-code --default-chat-template-kwargs '{"enable_thinking":false}'
        resources:
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "7"
            memory: 56Gi
            nvidia.com/gpu: "1"
