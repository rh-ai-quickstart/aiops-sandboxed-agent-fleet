# Namespace-agnostic: no Namespace object, no namespace fields, short service names. The
# namespace comes from the caller (pre-created by deploy.sh / lab.sh):
#   oc -n "$DEMO_NAMESPACE" apply -k manifests/demo-app/     (deploy.sh, Incident Lab)
#   oc -n "$DEMO_NAMESPACE" delete -k manifests/demo-app/    (cleanup.sh, Incident Lab)
# Generates the shop-app + payments ConfigMaps from their app.js (a hash suffix means editing
# either rolls it out), then applies the apps + loadgen.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - loadgen.yaml
  - payments.yaml
configMapGenerator:
  - name: shop-app-src
    files:
      - shop-app/app.js
  - name: payments-src
    files:
      - payments/app.js
